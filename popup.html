<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vercel Usage</title>
  <style>
    /* Vercel brand standards — All Brand Standards DB (Notion)
       Light dashboard card language: white/near-white, black type, #0070F3 */
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #FFFFFF;
      --surface: #FAFAFA;
      --border: #E5E5E5;
      --border-strong: #D1D1D1;
      --text: #000000;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --blue: #0070F3;
      --blue-soft: rgba(0, 112, 243, 0.08);
      /* On-demand segment — matches Vercel dashboard usage card */
      --violet: #8B5CF6;
      --focus: #0070F3;
      --green: #17B26A;
      --amber: #F79009;
      --red: #F04438;
      --track: #EDEDED;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      min-width: 320px;
      max-width: 320px;
      max-height: 560px;
      overflow-y: auto;
      padding: 14px 14px 12px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-left {
      min-width: 0;
      flex: 1;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .cycle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .cycle-sub {
      margin-top: 1px;
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tier-pill {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--bg);
    }

    .ghost-btn {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .ghost-btn:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }
    .ghost-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .error-prompt {
      background: #FEF3F2;
      border: 1px solid #FECDCA;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .error-prompt-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--red);
      margin-bottom: 6px;
    }
    .error-prompt-body {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .error-prompt-body ol {
      margin: 6px 0 0 16px;
    }
    .error-prompt-body li { margin-bottom: 2px; }
    .error-prompt-body strong { color: var(--text); font-weight: 500; }

    .primary-btn {
      display: inline-flex;
      width: 100%;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: #FFFFFF;
      background: var(--text);
      border: 1px solid var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .primary-btn:hover { opacity: 0.88; }

    /* Hero: Included Credit + On-Demand (dashboard card) */
    .hero {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: var(--bg);
      margin-bottom: 12px;
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .hero-col { min-width: 0; flex: 1; }
    .hero-col.right { text-align: right; }

    .hero-label {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }

    .hero-value {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .hero-value .muted {
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .split-track {
      display: flex;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--track);
    }
    .split-credit {
      height: 100%;
      background: var(--blue);
      min-width: 0;
    }
    .split-ondemand {
      height: 100%;
      background: var(--violet);
      min-width: 0;
    }

    .hero-meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: -0.01em;
    }
    .hero-meta .warn { color: var(--red); font-weight: 500; }

    .gateway {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: var(--surface);
    }
    .gateway-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }
    .gateway-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 1px;
    }
    .gateway-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin: 2px 0 8px;
    }

    .lines {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--bg);
    }

    .line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 9px 12px;
      border-top: 1px solid var(--border);
    }
    .line:first-child { border-top: none; }
    .line-name {
      font-size: 12px;
      color: var(--text);
      letter-spacing: -0.01em;
      min-width: 0;
    }
    .line-amt {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .meter {
      margin-bottom: 12px;
    }
    .meter-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .meter-label {
      font-size: 12px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .meter-value {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .bar-track {
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .empty {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 4px 0 8px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    .meta {
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .refresh-btn {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--blue);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 2px;
    }
    .refresh-btn:hover { text-decoration: underline; }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; text-decoration: none; }
    .refresh-btn:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .error {
      font-size: 11px;
      color: var(--red);
      margin-top: 8px;
    }

    .disclaimer {
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--text-tertiary);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="brand">Vercel Usage</div>
      <div class="cycle" id="cycle-label" style="display:none;"></div>
      <div class="cycle-sub" id="cycle-sub" style="display:none;"></div>
    </div>
    <div class="header-actions">
      <span class="tier-pill" id="tier-pill">—</span>
      <button class="ghost-btn" id="billing-btn" type="button">Billing</button>
    </div>
  </div>

  <div class="error-prompt" id="error-prompt" style="display:none;">
    <div class="error-prompt-title" id="error-prompt-title">Can't load usage</div>
    <div class="error-prompt-body" id="error-prompt-body"></div>
    <button class="primary-btn" id="open-usage-btn" type="button">Open dashboard</button>
  </div>

  <div id="main" style="display:none;">
    <div class="hero" id="hero-card">
      <div class="hero-row">
        <div class="hero-col">
          <div class="hero-label">Included Credit</div>
          <div class="hero-value" id="credit-value">—</div>
        </div>
        <div class="hero-col right">
          <div class="hero-label">On-Demand Charges</div>
          <div class="hero-value" id="ondemand-value">—</div>
        </div>
      </div>
      <div class="split-track" id="split-track" role="img" aria-label="Included credit vs on-demand charges">
        <div class="split-credit" id="split-credit" style="width:0%"></div>
        <div class="split-ondemand" id="split-ondemand" style="width:0%"></div>
      </div>
      <div class="hero-meta" id="hero-meta"></div>
    </div>

    <div class="gateway" id="gateway-card" style="display:none;">
      <div>
        <div class="gateway-label">AI Gateway</div>
        <div class="gateway-sub">Prepaid credit balance</div>
      </div>
      <div class="gateway-value" id="gateway-value">—</div>
    </div>

    <div class="section-title" id="lines-heading" style="display:none;">This cycle</div>
    <div class="lines" id="lines-slot" style="display:none;"></div>

    <div class="section-title" id="meters-heading" style="display:none;">Included usage</div>
    <div id="meters-slot"></div>
  </div>

  <div class="footer">
    <span class="meta" id="meta-label">Waiting for data…</span>
    <button class="refresh-btn" id="refresh-btn" type="button">Refresh</button>
  </div>
  <div class="error" id="error-label" style="display:none;"></div>
  <div class="disclaimer">Unofficial — not affiliated with Vercel</div>

  <script src="popup.js"></script>
</body>
</html>
